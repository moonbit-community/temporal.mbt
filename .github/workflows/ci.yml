name: Linux native
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the validated module to Mooncakes
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4
      - name: Install native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          rustup update stable
          rustup default stable
          protoc --version
          cargo --version
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Check and test Linux native bridge
        run: |
          moon version --all
          moon check --target native
          moon test --target native
      - name: Validate the packaged module
        run: python3 scripts/check_package.py
      - name: Publish validated package
        if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
        env:
          MOONCAKES_TOKEN: ${{ secrets.MOONCAKES_MOONBIT_COMMUNITY_TOKEN }}
        run: |
          if [ -z "$MOONCAKES_TOKEN" ]; then
            echo 'The organization Mooncakes publishing secret is unavailable.' >&2
            exit 1
          fi
          trap 'rm -f "$HOME/.moon/credentials.json"' EXIT
          printf '%s' "$MOONCAKES_TOKEN" > "$HOME/.moon/credentials.json"
          moon publish
